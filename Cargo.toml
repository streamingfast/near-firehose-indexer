near-indexer = { git = "https://github.com/near/nearcore", rev = "2.6.0-rc.1" }
near-crypto = { git = "https://github.com/near/nearcore", rev = "2.6.0-rc.1" }
near-primitives = { git = "https://github.com/near/nearcore", rev = "2.6.0-rc.1" }

[build-dependencies]
tonic-build = "0.8.4"
