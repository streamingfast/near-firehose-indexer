[workspace]
members = ["firehose-pb"]

[package]
name = "near-firehose-indexer"
version = "2.6.0-rc.1"
authors = ["StreamingFast Developers <dev@streamingfast.io>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.0"
anyhow = "1.0.51"
aws-config = "1.4.0"
aws-sdk-s3 = "1.29.0"
clap = { version = "4.5.4", features = ["color", "derive", "env"] }
dotenv = "0.15.0"
futures = "0.3.5"
hex = { version = "0.4.2", features = ["serde"] }
http = "1.1.0"
humantime = "2.1.0"
openssl-probe = "0.1.5"
once_cell = "1.19.0"
prost = "0.11.6"
prost-types = "0.11.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.55"
tokio = { version = "1.37.0", features = ["sync", "time"] }
tokio-stream = { version = "0.1" }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

