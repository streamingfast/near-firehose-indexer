[workspace]
members = ["firehose-pb"]

[package]
name = "near-firehose-indexer"
version = "2.11.0-rc.3-fh3.0"
authors = ["StreamingFast Developers <dev@streamingfast.io>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Copied over directly from to try to stay in sync with NEAR own indexer
actix = "0.13.0"
anyhow = "1.0.51"
aws-config = "1.4.0"
aws-sdk-s3 = "1.29.0"
clap = { version = "4.5.4", features = ["color", "derive", "env"] }
dotenv = "0.15.0"
futures = "0.3.5"
http = "1.1.0"
humantime = "2.1.0"
openssl-probe = "0.1.5"
once_cell = "1.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.55"
tokio = { version = "1.37.0", features = ["sync", "time"] }
tokio-stream = { version = "0.1" }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

# Additional dependencies for NEAR
near-indexer = { git = "https://github.com/near/nearcore", rev = "2.11.0-rc.3" }
near-crypto = { git = "https://github.com/near/nearcore", rev = "2.11.0-rc.3" }
near-primitives = { git = "https://github.com/near/nearcore", rev = "2.11.0-rc.3" }

# StreamingFast needed dependencies
base64 = "0.21"
hex = { version = "0.4.2", features = ["serde"] }
prost = "0.11.6"
prost-types = "0.11.6"

[build-dependencies]
tonic-build = "0.8.4"
